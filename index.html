<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskDesk - Todo App Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-icon">✓</div>
        <div>
          <h1>TaskDesk Dashboard</h1>
          <p id="currentDate">Organize your daily work and projects</p>
        </div>
      </div>
      <button id="openModalBtn" class="btn btn-primary">+ Add New Task</button>
    </header>

    <!-- Stats Overview Cards -->
    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-icon total-icon">📋</div>
        <div class="stat-info">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon pending-icon">⏳</div>
        <div class="stat-info">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon completed-icon">✅</div>
        <div class="stat-info">
          <span class="stat-value" id="statCompleted">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon high-icon">🔥</div>
        <div class="stat-info">
          <span class="stat-value" id="statHighPriority">0</span>
          <span class="stat-label">High Priority</span>
        </div>
      </div>
    </section>

    <!-- Progress Bar -->
    <section class="progress-section">
      <div class="progress-header">
        <span>Completion Progress</span>
        <span id="progressPercentage">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- Controls & Filters Toolbar -->
    <section class="toolbar-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tasks by title or description...">
      </div>

      <div class="filters-row">
        <div class="status-tabs">
          <button class="status-tab active" data-status="all">All</button>
          <button class="status-tab" data-status="pending">Pending</button>
          <button class="status-tab" data-status="completed">Completed</button>
        </div>

        <div class="dropdown-group">
          <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Finance">Finance</option>
          </select>

          <select id="priorityFilter">
            <option value="all">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>

          <select id="sortBy">
            <option value="dueDate">Sort by Due Date</option>
            <option value="priority">Sort by Priority</option>
            <option value="title">Sort by Title</option>
            <option value="createdAt">Sort by Date Created</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Quick Action Bar -->
    <section class="quick-actions">
      <span id="taskCountSummary">Showing 0 tasks</span>
      <div class="action-buttons">
        <button id="markAllCompleteBtn" class="btn-sm">Mark All Completed</button>
        <button id="clearCompletedBtn" class="btn-sm btn-danger-outline">Clear Completed</button>
      </div>
    </section>

    <!-- Main Task List Container -->
    <main class="task-list-container">
      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📌</div>
        <h3>No Tasks Found</h3>
        <p>Try adjusting your search query or filter settings, or add a new task!</p>
      </div>
    </main>
  </div>

  <!-- Add / Edit Task Modal Dialog -->
  <div id="taskModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Task</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <form id="taskForm">
        <input type="hidden" id="taskId">
        
        <div class="form-group">
          <label for="taskTitle">Title *</label>
          <input type="text" id="taskTitle" placeholder="e.g., Complete quarterly report" required>
        </div>

        <div class="form-group">
          <label for="taskDescription">Description</label>
          <textarea id="taskDescription" rows="3" placeholder="Add extra details, sub-notes, or links..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="taskCategory">Category</label>
            <select id="taskCategory">
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health</option>
              <option value="Finance">Finance</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate">
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
